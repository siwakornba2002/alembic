name: Build PyAlembic wheel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-pyalembic.yml"
      - ".github/scripts/build_pyalembic_manylinux.sh"
      - "examples/read_alembic.py"

permissions:
  contents: read

jobs:
  build-linux-cp39:
    name: Linux x86_64 / CPython 3.9
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64:latest

    steps:
      - name: Check out this fork
        uses: actions/checkout@v4

      - name: Build and test the wheel
        shell: bash
        run: .github/scripts/build_pyalembic_manylinux.sh

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pyalembic-1.8.12-cp39-manylinux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30
